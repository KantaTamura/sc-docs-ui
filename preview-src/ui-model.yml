antoraVersion: '3.1.0'
site:
  url: http://localhost:5252
  title: Space Cubics Documentation
  homeUrl: &home_url /index.html
  components:
  - &component
    name: ui-preview
    title: UI Preview
    url: *home_url
    versions:
    - &component_version
      title: UI Preview
      url: *home_url
      version: preview
      displayVersion: Preview
    latestVersion: *component_version
page:
  url: *home_url
  home: true
  title: UI Preview
  component: *component
  componentVersion: *component_version
  version: preview
  displayVersion: Preview
  module: ROOT
  relativeSrcPath: index.adoc
  editUrl: https://github.com/spacecubics/sc-docs-ui/blob/main/preview-src/index.adoc
  origin:
    private: false
  breadcrumbs:
  - content: UI Preview
    url: *home_url
    urlType: internal
  versions:
  - version: preview
    displayVersion: Preview
    url: *home_url
  navigation:
  - root: true
    items:
    - content: UI Preview
      url: *home_url
      urlType: internal
      items:
      - content: Cu Solet
        url: '/index.html#cu-solet'
        urlType: internal
      - content: English + 中文
        url: '/index.html#english+中文'
        urlType: internal
    - content: Liber Recusabo
      url: '/index.html#liber-recusabo'
      urlType: internal
    - content: Reference
      items:
      - content: Code Samples
        url: '/index.html#some-code'
        urlType: internal
      - content: Dependency Table
        url: '/index.html#dependencies'
        urlType: internal
